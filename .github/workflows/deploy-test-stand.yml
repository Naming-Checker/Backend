name: Deploy Test Stand

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-test-stand-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REMOTE_APP_DIR: ${{ secrets.TEST_STAND_APP_DIR != '' && secrets.TEST_STAND_APP_DIR || '/opt/naming-check-backend' }}
  REMOTE_PORT: ${{ secrets.TEST_STAND_PORT != '' && secrets.TEST_STAND_PORT || '22' }}
  HOST_BIND_PORT: ${{ secrets.TEST_STAND_BIND_PORT != '' && secrets.TEST_STAND_BIND_PORT || '8000' }}
  VISUAL_MODELS_HOST_DIR: ${{ secrets.TEST_STAND_VISUAL_MODELS_DIR != '' && secrets.TEST_STAND_VISUAL_MODELS_DIR || '/opt/visual-model-models' }}
  VISUAL_DATA_HOST_DIR: ${{ secrets.TEST_STAND_VISUAL_DATA_DIR != '' && secrets.TEST_STAND_VISUAL_DATA_DIR || '/opt/visual-model-data' }}
  VISUAL_HOST_BIND_PORT: ${{ secrets.TEST_STAND_VISUAL_BIND_PORT != '' && secrets.TEST_STAND_VISUAL_BIND_PORT || '9000' }}
  TEXT_MODELS_HOST_DIR: ${{ secrets.TEST_STAND_TEXT_MODELS_DIR != '' && secrets.TEST_STAND_TEXT_MODELS_DIR || '/opt/text-model-models' }}
  TEXT_HOST_BIND_PORT: ${{ secrets.TEST_STAND_TEXT_BIND_PORT != '' && secrets.TEST_STAND_TEXT_BIND_PORT || '9100' }}

jobs:
  pre-deploy-checks:
    name: pre-deploy-checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run CI checks before deploy
        run: make ci

  # Build heavy images (PyTorch) on the runner — tiny VPS disks cannot finish `docker build` locally.
  build-and-push-images:
    name: build-and-push-images
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    outputs:
      registry_prefix: ${{ steps.meta.outputs.prefix }}
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Image names (GHCR, lowercase)
        id: meta
        run: |
          set -euo pipefail
          repo_lc="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          set -euo pipefail
          prefix="${{ steps.meta.outputs.prefix }}"
          tag="${{ steps.meta.outputs.tag }}"
          docker build -t "${prefix}/naming-check-backend:${tag}" .
          docker push "${prefix}/naming-check-backend:${tag}"

      - name: Build and push visual-model-service image
        run: |
          set -euo pipefail
          prefix="${{ steps.meta.outputs.prefix }}"
          tag="${{ steps.meta.outputs.tag }}"
          docker build -t "${prefix}/visual-model-service:${tag}" ./visual-model-service
          docker push "${prefix}/visual-model-service:${tag}"

      - name: Build and push text-model-service image
        run: |
          set -euo pipefail
          prefix="${{ steps.meta.outputs.prefix }}"
          tag="${{ steps.meta.outputs.tag }}"
          docker build -t "${prefix}/text-model-service:${tag}" ./text-model-service
          docker push "${prefix}/text-model-service:${tag}"

  deploy:
    name: deploy-test-stand
    runs-on: ubuntu-latest
    needs: build-and-push-images
    environment: test-stand
    # Caps rare hangs (SSH/docker exec stuck); pulls + verify should finish well under this.
    timeout-minutes: 45

    env:
      # Prevent long idle SSH sessions from dropping mid `docker build` (Broken pipe / exit 255).
      GHA_SSH_OPTS: >-
        -o ServerAliveInterval=30
        -o ServerAliveCountMax=480
        -o TCPKeepAlive=yes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require deploy secrets
        env:
          TEST_STAND_HOST: ${{ secrets.TEST_STAND_HOST }}
          TEST_STAND_SSH_KEY: ${{ secrets.TEST_STAND_SSH_KEY }}
          TEST_STAND_USER: ${{ secrets.TEST_STAND_USER }}
        run: |
          missing=
          [ -z "$TEST_STAND_HOST" ] && { echo "::error::TEST_STAND_HOST is empty or unset. Add it under Settings → Secrets → Actions (or Environment \`test-stand\` → environment secrets)."; missing=1; }
          [ -z "$TEST_STAND_SSH_KEY" ] && { echo "::error::TEST_STAND_SSH_KEY is empty or unset."; missing=1; }
          [ -z "$TEST_STAND_USER" ] && { echo "::error::TEST_STAND_USER is empty or unset."; missing=1; }
          exit "${missing:-0}"

      - name: Configure SSH key
        env:
          TEST_STAND_SSH_KEY: ${{ secrets.TEST_STAND_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TEST_STAND_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Trust test stand host key
        env:
          TEST_STAND_HOST: ${{ secrets.TEST_STAND_HOST }}
        run: ssh-keyscan -p "$REMOTE_PORT" "$TEST_STAND_HOST" >> ~/.ssh/known_hosts

      - name: Sync backend source to test stand
        run: |
          RSYNC_RSH="ssh ${{ env.GHA_SSH_OPTS }} -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -p ${REMOTE_PORT}"
          ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "mkdir -p '$REMOTE_APP_DIR'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.mypy_cache' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude '*.pt' \
            --exclude '.env' \
            -e "$RSYNC_RSH" \
            ./ "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}:$REMOTE_APP_DIR/"

      - name: Ensure visual models directory exists on server
        run: |
          ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "mkdir -p '$VISUAL_MODELS_HOST_DIR'"

      - name: Ensure visual data directory exists on server
        run: |
          ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "mkdir -p '$VISUAL_DATA_HOST_DIR/data/logos'"

      - name: Ensure text models directory exists on server
        run: |
          ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "mkdir -p '$TEXT_MODELS_HOST_DIR'"

      - name: Write runtime env file on test stand (backend)
        env:
          TEST_STAND_ENV_FILE: ${{ secrets.TEST_STAND_ENV_FILE }}
        run: |
          cat <<EOF | ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "cat > '$REMOTE_APP_DIR/.env.runtime'"
          APP_NAME=Backend Service
          APP_ENV=production
          LOG_LEVEL=INFO
          APP_HOST=0.0.0.0
          APP_PORT=8000
          VISUAL_MODEL_SERVICE_BASE_URL=http://visual-model-service:9000
          TEXT_MODEL_SERVICE_BASE_URL=http://text-model-service:9000
          CORS_ALLOW_ORIGINS=http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:3000,http://localhost:3000
          CORS_ALLOW_METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
          CORS_ALLOW_HEADERS=*
          CORS_ALLOW_CREDENTIALS=false
          ELASTIC_APM_ENABLED=true
          ELASTIC_APM_SERVER_URL=http://apm-server:8200
          ELASTIC_APM_SERVICE_NAME=naming-check-backend
          ELASTIC_APM_ENVIRONMENT=production
          ELASTIC_APM_TRANSACTION_SAMPLE_RATE=1.0
          $TEST_STAND_ENV_FILE
          EOF

      - name: Write runtime env file on test stand (visual model)
        env:
          TEST_STAND_VISUAL_ENV_FILE: ${{ secrets.TEST_STAND_VISUAL_ENV_FILE }}
        run: |
          cat <<EOF | ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "cat > '$REMOTE_APP_DIR/visual-model-service/.env.runtime'"
          LOG_LEVEL=INFO
          APP_ENV=production
          APP_HOST=0.0.0.0
          APP_PORT=9000
          EMBEDDINGS_PT_PATH=/app/models/logos_embedding.pt
          EMBEDDINGS_CSV_PATH=/app/models/logos_embedding.csv
          ASSETS_ROOT=/app/assets
          ELASTIC_APM_ENABLED=true
          ELASTIC_APM_SERVER_URL=http://apm-server:8200
          ELASTIC_APM_SERVICE_NAME=visual-model-service
          ELASTIC_APM_ENVIRONMENT=production
          ELASTIC_APM_TRANSACTION_SAMPLE_RATE=1.0
          $TEST_STAND_VISUAL_ENV_FILE
          EOF

      - name: Write runtime env file on test stand (text model)
        env:
          TEST_STAND_TEXT_ENV_FILE: ${{ secrets.TEST_STAND_TEXT_ENV_FILE }}
        run: |
          cat <<EOF | ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "cat > '$REMOTE_APP_DIR/text-model-service/.env.runtime'"
          LOG_LEVEL=INFO
          APP_ENV=production
          APP_HOST=0.0.0.0
          APP_PORT=9000
          EMBEDDINGS_PT_PATH=/app/models/text_embedding.pt
          EMBEDDINGS_CSV_PATH=/app/models/text_embedding.csv
          MODEL_PATH=/app/models/rubert-tiny2
          ELASTIC_APM_ENABLED=true
          ELASTIC_APM_SERVER_URL=http://apm-server:8200
          ELASTIC_APM_SERVICE_NAME=text-model-service
          ELASTIC_APM_ENVIRONMENT=production
          ELASTIC_APM_TRANSACTION_SAMPLE_RATE=1.0
          $TEST_STAND_TEXT_ENV_FILE
          EOF

      - name: Write runtime env file on test stand (ELK)
        env:
          TEST_STAND_ELK_ENV_FILE: ${{ secrets.TEST_STAND_ELK_ENV_FILE }}
          TEST_STAND_HOST: ${{ secrets.TEST_STAND_HOST }}
        run: |
          cat <<EOF | ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "cat > '$REMOTE_APP_DIR/infra/logging/.env.elk'"
          STACK_VERSION=8.17.0
          ES_JAVA_OPTS="-Xms512m -Xmx512m"
          KIBANA_PUBLIC_BASE_URL=http://${TEST_STAND_HOST}:5601
          $TEST_STAND_ELK_ENV_FILE
          EOF

      - name: Pull and restart containers (images from GHCR)
        run: |
          set -euo pipefail
          PREFIX="${{ needs.build-and-push-images.outputs.registry_prefix }}"
          TAG="${{ needs.build-and-push-images.outputs.image_tag }}"
          export GHCR_PULL_TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"
          export GHCR_PULL_USER="${{ secrets.GHCR_PULL_USER }}"
          ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            env \
              PREFIX="$PREFIX" \
              TAG="$TAG" \
              REMOTE_APP_DIR="$REMOTE_APP_DIR" \
              VISUAL_MODELS_HOST_DIR="$VISUAL_MODELS_HOST_DIR" \
              VISUAL_DATA_HOST_DIR="$VISUAL_DATA_HOST_DIR" \
              TEXT_MODELS_HOST_DIR="$TEXT_MODELS_HOST_DIR" \
              HOST_BIND_PORT="$HOST_BIND_PORT" \
              VISUAL_HOST_BIND_PORT="$VISUAL_HOST_BIND_PORT" \
              TEXT_HOST_BIND_PORT="$TEXT_HOST_BIND_PORT" \
              GHCR_PULL_TOKEN="$GHCR_PULL_TOKEN" \
              GHCR_PULL_USER="$GHCR_PULL_USER" \
            bash -s <<'EOS'
          set -euo pipefail
          if [ -n "${GHCR_PULL_TOKEN:-}" ] && [ -n "${GHCR_PULL_USER:-}" ]; then
            printf '%s\n' "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_PULL_USER" --password-stdin
          fi
          echo "Pruning unused Docker images to free disk before pull..."
          docker image prune -af || true
          docker builder prune -af || true
          pull_with_retry() {
            image="$1"
            attempts="${2:-6}"
            delay="${3:-10}"
            i=1
            while [ "$i" -le "$attempts" ]; do
              if docker pull "$image"; then
                return 0
              fi
              if [ "$i" -eq "$attempts" ]; then
                echo "::error::Failed to pull $image after $attempts attempts." >&2
                return 1
              fi
              echo "Pull failed for $image (attempt $i/$attempts). Retrying in ${delay}s..." >&2
              sleep "$delay"
              i=$((i + 1))
            done
          }
          pull_with_retry "${PREFIX}/naming-check-backend:${TAG}" 6 15
          pull_with_retry "${PREFIX}/visual-model-service:${TAG}" 6 15
          pull_with_retry "${PREFIX}/text-model-service:${TAG}" 6 15
          echo "Pull complete. Starting containers..."
          docker network create naming-check-net 2>/dev/null || true
          ELK_DIR="${REMOTE_APP_DIR}/infra/logging"
          if [ -f "${ELK_DIR}/.env.elk" ] && grep -q '^ELASTIC_PASSWORD=' "${ELK_DIR}/.env.elk"; then
            echo "Starting ELK stack..."
            pull_with_retry "docker.elastic.co/elasticsearch/elasticsearch:8.17.0" 6 15
            pull_with_retry "docker.elastic.co/kibana/kibana:8.17.0" 6 15
            pull_with_retry "docker.elastic.co/beats/filebeat:8.17.0" 6 15
            pull_with_retry "docker.elastic.co/apm/apm-server:8.17.0" 6 15
            docker rm -f elk-setup kibana-setup >/dev/null 2>&1 || true
            docker compose -f "${ELK_DIR}/docker-compose.elk.yml" \
              --env-file "${ELK_DIR}/.env.elk" \
              --project-directory "${ELK_DIR}" \
              up -d
          else
            echo "::warning::Skipping ELK: ${ELK_DIR}/.env.elk missing ELASTIC_PASSWORD. Set TEST_STAND_ELK_ENV_FILE secret." >&2
          fi
          docker rm -f naming-check-backend >/dev/null 2>&1 || true
          docker rm -f visual-model-service >/dev/null 2>&1 || true
          docker rm -f text-model-service >/dev/null 2>&1 || true
          docker run -d \
            --name visual-model-service \
            --label co.elastic.logs/enabled=true \
            --label co.elastic.logs/json.message_key=log \
            --label co.elastic.logs/json.keys_under_root=true \
            --network naming-check-net \
            --restart unless-stopped \
            --env-file "${REMOTE_APP_DIR}/visual-model-service/.env.runtime" \
            -v "${VISUAL_MODELS_HOST_DIR}:/app/models:ro" \
            -v "${VISUAL_DATA_HOST_DIR}:/app/assets:ro" \
            -p "127.0.0.1:${VISUAL_HOST_BIND_PORT}:9000" \
            "${PREFIX}/visual-model-service:${TAG}"
          docker run -d \
            --name text-model-service \
            --label co.elastic.logs/enabled=true \
            --label co.elastic.logs/json.message_key=log \
            --label co.elastic.logs/json.keys_under_root=true \
            --network naming-check-net \
            --restart unless-stopped \
            --env-file "${REMOTE_APP_DIR}/text-model-service/.env.runtime" \
            -v "${TEXT_MODELS_HOST_DIR}:/app/models:ro" \
            -p "127.0.0.1:${TEXT_HOST_BIND_PORT}:9000" \
            "${PREFIX}/text-model-service:${TAG}"
          docker run -d \
            --name naming-check-backend \
            --label co.elastic.logs/enabled=true \
            --label co.elastic.logs/json.message_key=log \
            --label co.elastic.logs/json.keys_under_root=true \
            --network naming-check-net \
            --restart unless-stopped \
            --env-file "${REMOTE_APP_DIR}/.env.runtime" \
            -p "${HOST_BIND_PORT}:8000" \
            "${PREFIX}/naming-check-backend:${TAG}"
          if docker ps --format '{{.Names}}' | grep -qx 'filebeat'; then
            docker restart filebeat
            echo "Filebeat restarted to pick up application containers."
          fi
          echo "Containers started."
          docker image prune -f --filter until=24h >/dev/null 2>&1 || true
          EOS


      - name: Verify deployed containers
        run: |
          set -euo pipefail
          ssh ${{ env.GHA_SSH_OPTS }} -i "$HOME/.ssh/id_ed25519" -o IdentitiesOnly=yes -p "$REMOTE_PORT" \
            "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            env REMOTE_APP_DIR="$REMOTE_APP_DIR" \
            bash -s <<'VERIFY'
          set -euo pipefail
          sleep 8
          docker ps --filter name=naming-check-backend
          docker ps --filter name=visual-model-service
          docker ps --filter name=text-model-service

          ok_backend=0
          attempt=0
          for _ in $(seq 1 72); do
            attempt=$((attempt + 1))
            # timeout(1) avoids a stuck docker exec blocking the whole GitHub job.
            if timeout 40 docker exec naming-check-backend python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=10).read()" >/dev/null 2>&1; then
              ok_backend=1
              echo "Backend health OK (attempt ${attempt})."
              break
            fi
            if [[ $((attempt % 6)) -eq 0 ]]; then
              echo "[verify] still waiting for backend HTTP on :8000 (${attempt}/72, ~$((attempt * 5))s)..."
            fi
            sleep 5
          done
          if [[ "${ok_backend}" != 1 ]]; then
            docker logs naming-check-backend --tail 200 >&2 || true
            exit 1
          fi

          # Wait for embeddings + VGG to finish loading (can be several minutes on small VPS).
          ok_visual=0
          attempt=0
          for _ in $(seq 1 120); do
            attempt=$((attempt + 1))
            if timeout 40 docker exec visual-model-service python -c "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=10); d=json.loads(r.read().decode()); raise SystemExit(0 if d.get('status')=='ok' else 1)" >/dev/null 2>&1; then
              ok_visual=1
              echo "Visual health OK (attempt ${attempt}, status ok)."
              break
            else
              te=$?
              if [[ "${te}" -eq 124 ]]; then
                echo "[verify] docker exec or health check hit 40s wall-clock limit (attempt ${attempt}). Check docker / container CPU." >&2
              fi
            fi
            if [[ $((attempt % 6)) -eq 0 ]]; then
              echo "[verify] waiting for visual /health status=ok (embeddings+VGG warm-up) (${attempt}/120, ~$((attempt * 5))s max)..."
            fi
            sleep 5
          done
          if [[ "${ok_visual}" != 1 ]]; then
            echo "::error::Visual did not reach health status=ok within ~10m. Often: wrong/missing mount for logos_embedding.pt + .csv, OOM, or disk I/O. See logs below." >&2
            docker logs visual-model-service --tail 300 >&2 || true
            exit 1
          fi

          ok_text=0
          attempt=0
          for _ in $(seq 1 120); do
            attempt=$((attempt + 1))
            if timeout 40 docker exec text-model-service python -c "import json, urllib.request; r=urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=10); d=json.loads(r.read().decode()); raise SystemExit(0 if d.get('status')=='ok' else 1)" >/dev/null 2>&1; then
              ok_text=1
              echo "Text health OK (attempt ${attempt}, status ok)."
              break
            else
              te=$?
              if [[ "${te}" -eq 124 ]]; then
                echo "[verify] text-model-service health check hit 40s wall-clock limit (attempt ${attempt})." >&2
              fi
            fi
            if [[ $((attempt % 6)) -eq 0 ]]; then
              echo "[verify] waiting for text /health status=ok (model+embeddings warm-up) (${attempt}/120, ~$((attempt * 5))s max)..."
            fi
            sleep 5
          done
          if [[ "${ok_text}" != 1 ]]; then
            echo "::error::Text model did not reach health status=ok within ~10m. Often: missing text_embedding.pt/.csv, missing rubert-tiny2 snapshot, or OOM." >&2
            docker logs text-model-service --tail 300 >&2 || true
            exit 1
          fi

          if docker ps --format '{{.Names}}' | grep -qx 'apm-server'; then
            ok_apm=0
            for _ in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:8200/ >/dev/null 2>&1; then
                ok_apm=1
                echo "APM Server status OK."
                break
              fi
              sleep 5
            done
            if [[ "${ok_apm}" != 1 ]]; then
              echo "::error::APM Server did not become available on 127.0.0.1:8200." >&2
              docker logs apm-server --tail 200 >&2 || true
              exit 1
            fi
          fi

          if docker ps --format '{{.Names}}' | grep -qx 'kibana'; then
            ok_kibana=0
            for _ in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:5601/api/status | grep -q '"level":"available"'; then
                ok_kibana=1
                echo "Kibana status OK."
                break
              fi
              sleep 5
            done
            if [[ "${ok_kibana}" != 1 ]]; then
              echo "::error::Kibana did not become available on 127.0.0.1:5601." >&2
              docker logs kibana --tail 200 >&2 || true
              exit 1
            fi
          fi
          VERIFY
