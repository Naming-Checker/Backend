name: Deploy Test Stand

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-test-stand-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REMOTE_APP_DIR: ${{ secrets.TEST_STAND_APP_DIR != '' && secrets.TEST_STAND_APP_DIR || '/opt/naming-check-backend' }}
  REMOTE_PORT: ${{ secrets.TEST_STAND_PORT != '' && secrets.TEST_STAND_PORT || '22' }}
  HOST_BIND_PORT: ${{ secrets.TEST_STAND_BIND_PORT != '' && secrets.TEST_STAND_BIND_PORT || '8000' }}

jobs:
  pre-deploy-checks:
    name: pre-deploy-checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run CI checks before deploy
        run: make ci

  deploy:
    name: deploy-test-stand
    runs-on: ubuntu-latest
    needs: pre-deploy-checks
    environment: test-stand

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          TEST_STAND_SSH_KEY: ${{ secrets.TEST_STAND_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TEST_STAND_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Trust test stand host key
        run: ssh-keyscan -p "$REMOTE_PORT" "${{ secrets.TEST_STAND_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync backend source to test stand
        run: |
          ssh -p "$REMOTE_PORT" "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "mkdir -p '$REMOTE_APP_DIR'"
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '.mypy_cache' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            ./ "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}:$REMOTE_APP_DIR/"

      - name: Write runtime env file on test stand
        env:
          TEST_STAND_ENV_FILE: ${{ secrets.TEST_STAND_ENV_FILE }}
        run: |
          cat <<EOF | ssh -p "$REMOTE_PORT" "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "cat > '$REMOTE_APP_DIR/.env.runtime'"
          APP_NAME=Backend Service
          APP_ENV=production
          APP_HOST=0.0.0.0
          APP_PORT=8000
          $TEST_STAND_ENV_FILE
          EOF

      - name: Build and restart backend container
        run: |
          ssh -p "$REMOTE_PORT" "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "set -e
            docker build -t naming-check-backend:main '$REMOTE_APP_DIR'
            docker rm -f naming-check-backend >/dev/null 2>&1 || true
            docker run -d \
              --name naming-check-backend \
              --restart unless-stopped \
              --env-file '$REMOTE_APP_DIR/.env.runtime' \
              -p '$HOST_BIND_PORT:8000' \
              naming-check-backend:main"

      - name: Verify deployed container
        run: |
          ssh -p "$REMOTE_PORT" "${{ secrets.TEST_STAND_USER }}@${{ secrets.TEST_STAND_HOST }}" \
            "set -e
            sleep 3
            docker ps --filter name=naming-check-backend --format '{{.Names}} {{.Status}}'
            docker exec naming-check-backend python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').read()\" >/dev/null"
