filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: false
      templates:
        - condition:
            or:
              - contains:
                  docker.container.name: naming-check-backend
              - contains:
                  docker.container.name: visual-model-service
              - contains:
                  docker.container.name: text-model-service
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              processors:
                - add_docker_metadata: ~

processors:
  # Docker json-file: {"log":"...","stream":"stdout","time":"..."}
  - decode_json_fields:
      fields: ["message"]
      target: "docker"
      add_error_key: true
      when:
        regexp:
          message: '^\s*\{'
  - decode_json_fields:
      fields: ["docker.log"]
      target: ""
      overwrite_keys: true
      add_error_key: true
      when:
        has_fields: ["docker.log"]
  # App logs written directly as JSON to stdout (no docker wrapper)
  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true
      when:
        and:
          - regexp:
              message: '^\s*\{'
          - not:
              has_fields: ["service"]
  - add_fields:
      target: "data_stream"
      fields:
        type: logs
        dataset: naming-check
        namespace: default
  - drop_fields:
      fields: ["docker.log", "docker.stream", "docker.time", "agent.ephemeral_id"]
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: elastic
  password: "${ELASTIC_PASSWORD}"
  index: "logs-naming-check-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.enabled: false
